name: Desktop end to end

# The Compose Multiplatform desktop app in e2e/desktop-compose, packaged with createDistributable
# and run headless under Xvfb, three launches against a stand-in Zharp (e2e/lib/receiver.mjs):
# a handled error, a crash on the Compose window's thread while offline (kept on disk), and an
# uncaught exception on a worker thread that also sends the earlier crash. See e2e/desktop.mjs.
on:
  workflow_dispatch:
  push:
    branches: [feat/desktop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Xvfb and the libraries Compose for Desktop needs
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libxrender1 libxtst6 libxi6 libfontconfig1
      - name: Zharp's artifacts into build/e2e-repo
        run: ./gradlew publishAllPublicationsToE2eRepository --console=plain -q
      - name: Build, package and run the desktop app
        env:
          E2E_DOCKER: '0'
          E2E_MOCK: '1'
        run: node e2e/desktop.mjs
      - name: What was sent
        if: always()
        run: cat e2e/.runs/desktop-mock.json | head -c 20000 || true
