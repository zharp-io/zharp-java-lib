name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      # Gradle itself runs on the JDK above; bytecode is Java 8 for the agent, library and plugins.
      - name: Build, unit tests, agent jar
        run: ./gradlew build -Pzharp.jdk=${{ matrix.java }} --stacktrace
      - name: Maven plugin
        working-directory: zharp-maven-plugin
        run: ./mvnw -B verify
      - name: Agent jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: zharp-agent
          path: zharp-agent/build/release/zharp-agent.jar
